<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base target="_top">
  <title>HAGAP — Controle de Obras</title>
  <style>
    :root{--azul:#0b3d91;--amarelo:#ffd000;--bg:#eef4ff;--txt:#162033;--muted:#687386;--linha:#d8e2ef;--verde:#18794e;--verdebg:#dff6ea;--ambar:#956400;--ambarbg:#fff3cd;--roxo:#6b21a8;--roxobg:#f3e8ff;--sombra:0 10px 30px rgba(20,55,100,.10)}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt)}
    header{padding:18px 26px;background:linear-gradient(95deg,var(--azul),#0e4ca6 62%,var(--amarelo));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
    .brand{display:flex;align-items:center;gap:16px}.brand img{width:170px;max-height:70px;object-fit:contain;background:#fff;border-radius:10px;padding:5px 9px}
    h1{margin:0;font-size:28px}.sub{margin-top:5px;font-weight:700;opacity:.9}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer;background:#fff;color:var(--azul)}.btn.primary{background:var(--azul);color:#fff}.btn:disabled{opacity:.55;cursor:wait}
    .wrap{max-width:1650px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:12px;margin-bottom:15px}
    .card,.panel{background:#fff;border:1px solid var(--linha);border-radius:13px;box-shadow:var(--sombra)}.card{padding:15px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--muted)}.value{font-size:30px;font-weight:900;color:var(--azul);margin-top:5px}
    .panel{padding:15px;margin-bottom:15px}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.toolbar input[type=search]{flex:1;min-width:240px;padding:11px 12px;border:1px solid #c8d3e2;border-radius:9px;font-size:14px}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{font-size:13px;font-weight:700}
    .statusline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;color:var(--muted);font-size:12px}.scroll{overflow:auto;border:1px solid var(--linha);border-radius:10px}
    table{border-collapse:collapse;width:100%;min-width:1120px;background:#fff}th{position:sticky;top:0;background:var(--azul);color:#fff;text-align:left;padding:10px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}td{padding:9px 10px;border-bottom:1px solid #edf1f6;font-size:13px}tbody tr:hover{background:#f7faff}
    .projeto{color:var(--azul);font-weight:900;cursor:pointer;border:0;background:transparent;padding:0;font-size:14px}.badge{display:inline-flex;min-width:32px;justify-content:center;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;background:#f0f2f5;color:#97a0ae}.ok{background:var(--verdebg);color:var(--verde)}.warn{background:var(--ambarbg);color:var(--ambar)}.blue{background:#e3edff;color:var(--azul)}.final{background:var(--roxobg);color:var(--roxo)}
    .modal{position:fixed;inset:0;background:rgba(5,18,40,.58);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.hidden{display:none}.modalbox{width:min(940px,97vw);max-height:88vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 28px 70px rgba(0,0,0,.35)}.mhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--linha);padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.mhead h2{margin:0}.close{width:34px;height:34px;border:0;border-radius:50%;font-size:22px;cursor:pointer}
    .timeline{padding:18px}.event{border-left:4px solid var(--amarelo);background:#f9fbfe;border-radius:9px;padding:11px 13px;margin-bottom:10px}.eventtop{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}.kind{font-weight:900;color:var(--azul)}.meta{color:var(--muted);font-size:12px;margin-top:5px}.mail{display:inline-block;margin-top:7px;color:var(--azul);font-size:12px;font-weight:800;text-decoration:none}.empty{text-align:center;color:var(--muted);padding:28px}
    @media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){header{align-items:flex-start;flex-direction:column;padding:14px}.brand img{width:120px}.brand h1{font-size:22px}.wrap{padding:10px}.cards{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<header>
  <div class="brand">
    <img id="logo" alt="HAGAP">
    <div><h1>Controle de Obras</h1><div class="sub">Programação → Documentos → BMD → FFO</div></div>
  </div>
  <div class="actions">
    <span id="syncTxt">Carregando...</span>
    <button class="btn" onclick="abrirPlanilha()">Base</button>
    <button id="syncBtn" class="btn primary" onclick="sincronizar()">Sincronizar agora</button>
  </div>
</header>

<main class="wrap">
  <section class="cards">
    <div class="card"><div class="label">Obras</div><div id="kTotal" class="value">—</div></div>
    <div class="card"><div class="label">Documentos enviados</div><div id="kDocs" class="value">—</div></div>
    <div class="card"><div class="label">Documentos parcial</div><div id="kParc" class="value">—</div></div>
    <div class="card"><div class="label">Programadas</div><div id="kProg" class="value">—</div></div>
    <div class="card"><div class="label">Com BMD</div><div id="kBmd" class="value">—</div></div>
    <div class="card"><div class="label">Com FFO</div><div id="kFfo" class="value">—</div></div>
  </section>

  <section class="panel toolbar">
    <input id="busca" type="search" placeholder="Pesquisar projeto ou município..." oninput="filtrar()">
    <div class="checks">
      <label><input id="fDocs" type="checkbox" onchange="filtrar()"> Documentos</label>
      <label><input id="fParc" type="checkbox" onchange="filtrar()"> Parcial</label>
      <label><input id="fProg" type="checkbox" onchange="filtrar()"> Programada</label>
      <label><input id="fBmd" type="checkbox" onchange="filtrar()"> BMD</label>
      <label><input id="fFfo" type="checkbox" onchange="filtrar()"> FFO</label>
    </div>
    <button class="btn" onclick="limpar()">Limpar</button>
  </section>

  <section class="panel">
    <div class="statusline">
      <span id="contador">—</span>
      <span id="statusBase">—</span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>Projeto</th><th>Município</th><th>Documentos</th>
          <th>PDE</th><th>PLV</th><th>OMB</th><th>BMD</th><th>FFO</th>
          <th>Último movimento</th><th></th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="10" class="empty">Carregando...</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<div id="modal" class="modal hidden" onclick="fecharFora(event)">
  <div class="modalbox">
    <div class="mhead"><h2 id="mtitle">Projeto</h2><button class="close" onclick="fechar()">×</button></div>
    <div id="mbody" class="timeline"></div>
  </div>
</div>

<script>
  let base=null, linhas=[];
  const el=id=>document.getElementById(id);
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function badge(v,cls){return '<span class="badge '+(cls||'')+'">'+esc(v)+'</span>'}
  function fmtData(v){if(!v)return '—';const d=new Date(v);return isNaN(d.getTime())?esc(v):d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}

  function carregar(){
    google.script.run
      .withSuccessHandler(d=>{
        base=d;linhas=d.projetos||[];
        el('logo').src=d.logoUrl||'';
        el('kTotal').textContent=d.resumo.total;
        el('kDocs').textContent=d.resumo.documentosEnviados;
        el('kParc').textContent=d.resumo.documentosParciais;
        el('kProg').textContent=d.resumo.programadas;
        el('kBmd').textContent=d.resumo.comBmd;
        el('kFfo').textContent=d.resumo.comFfo;
        el('syncTxt').textContent=d.ultimaSync?'Atualizado: '+fmtData(d.ultimaSync):'Aguardando 1ª sincronização';
        el('statusBase').textContent=d.backfillConcluido?'Histórico 01/2025 → hoje concluído':'Carga histórica automática em andamento';
        filtrar();
      })
      .withFailureHandler(err=>{
        el('tbody').innerHTML='<tr><td colspan="10" class="empty">Erro: '+esc(err.message||err)+'</td></tr>';
      })
      .getPainelData();
  }

  function filtrar(){
    const q=el('busca').value.trim().toLowerCase();
    const filtros={
      docs:el('fDocs').checked,parc:el('fParc').checked,prog:el('fProg').checked,
      bmd:el('fBmd').checked,ffo:el('fFfo').checked
    };
    const ativo=Object.values(filtros).some(Boolean);

    const arr=linhas.filter(p=>{
      const txt=(p.projeto+' '+(p.municipio||'')).toLowerCase();
      if(q&&!txt.includes(q))return false;
      if(!ativo)return true;
      return (filtros.docs&&p.docFinal)||(filtros.parc&&p.docParcial&&!p.docFinal)||(filtros.prog&&p.programada)||(filtros.bmd&&p.bmds>0)||(filtros.ffo&&p.ffos>0);
    });

    el('contador').textContent=arr.length+' obra(s) exibida(s)';
    if(!arr.length){el('tbody').innerHTML='<tr><td colspan="10" class="empty">Nenhuma obra encontrada.</td></tr>';return}

    el('tbody').innerHTML=arr.map(p=>`
      <tr>
        <td><button class="projeto" onclick="detalhes('${esc(p.projeto)}')">${esc(p.projeto)}</button></td>
        <td>${esc(p.municipio||'—')}</td>
        <td>${p.docFinal?badge('ENVIADOS','ok'):(p.docParcial?badge('PARCIAL','warn'):badge('—',''))}</td>
        <td>${p.qtdPde?badge(p.qtdPde,'blue'):badge('—','')}</td>
        <td>${p.qtdPlv?badge(p.qtdPlv,'blue'):badge('—','')}</td>
        <td>${p.qtdOmb?badge(p.qtdOmb,'blue'):badge('—','')}</td>
        <td>${p.bmds?badge(p.bmds,'blue'):badge('—','')}</td>
        <td>${p.ffos?badge(p.ffos,'final'):badge('—','')}</td>
        <td>${fmtData(p.ultimoMovimento)}</td>
        <td><button class="btn" onclick="detalhes('${esc(p.projeto)}')">Detalhes</button></td>
      </tr>`).join('');
  }

  function limpar(){
    el('busca').value='';
    ['fDocs','fParc','fProg','fBmd','fFfo'].forEach(id=>el(id).checked=false);
    filtrar();
  }

  function sincronizar(){
    el('syncBtn').disabled=true;el('syncBtn').textContent='Sincronizando...';
    google.script.run
      .withSuccessHandler(()=>{el('syncBtn').disabled=false;el('syncBtn').textContent='Sincronizar agora';carregar()})
      .withFailureHandler(err=>{el('syncBtn').disabled=false;el('syncBtn').textContent='Sincronizar agora';alert(err.message||err)})
      .sincronizarAgora();
  }

  function abrirPlanilha(){if(base&&base.planilhaUrl)window.open(base.planilhaUrl,'_blank')}

  function detalhes(projeto){
    el('modal').classList.remove('hidden');
    el('mtitle').textContent='Projeto '+projeto;
    el('mbody').innerHTML='<div class="empty">Carregando histórico...</div>';

    google.script.run
      .withSuccessHandler(d=>{
        if(!d.eventos.length){el('mbody').innerHTML='<div class="empty">Sem eventos.</div>';return}
        el('mbody').innerHTML=d.eventos.map(e=>{
          const meta=[e.referencia?'Nº '+e.referencia:'',e.pdeRelacionado?'PDE '+e.pdeRelacionado:'',e.status||'',e.municipio||'',e.dataServico||'',(e.horaInicio&&e.horaFim)?e.horaInicio+'–'+e.horaFim:''].filter(Boolean).join(' · ');
          return `<div class="event">
            <div class="eventtop"><span class="kind">${esc(e.tipo)}</span><span>${fmtData(e.dataEmail)}</span></div>
            <strong>${esc(e.assunto||'')}</strong>
            <div class="meta">${esc(meta)}</div>
            ${e.anexo?'<div class="meta">Anexo: '+esc(e.anexo)+'</div>':''}
            ${e.urlEmail?'<a class="mail" href="'+esc(e.urlEmail)+'" target="_blank">Abrir e-mail</a>':''}
          </div>`;
        }).join('');
      })
      .withFailureHandler(err=>{el('mbody').innerHTML='<div class="empty">Erro: '+esc(err.message||err)+'</div>'})
      .getProjetoDetalhes(projeto);
  }

  function fechar(){el('modal').classList.add('hidden')}
  function fecharFora(e){if(e.target===el('modal'))fechar()}

  carregar();
  setInterval(carregar,60000);
</script>
</body>
</html>
